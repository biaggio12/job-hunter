parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Entity/'
            - '../src/Enum/'
            - '../src/Message/'
            - '../src/Dto/'
            - '../src/Portal/ScrapedOffer.php'
            - '../src/Kernel.php'
