monolog:
    channels: # To see all channels, run bin/console debug:autowiring logger
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            # Wszystko od poziomu INFO trafia na stderr → widoczne w `docker compose logs` (wymaganie niefunkcjonalne).
            main:
                type: stream
                path: php://stderr
                level: info
                channels: ["!event", "!doctrine", "!deprecation", "!php", "!messenger", "!cache"]
            errors_from_noisy_channels:
                type: stream
                path: php://stderr
                level: warning
                channels: ["php", "messenger"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]
